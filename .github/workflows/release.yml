# Publishes the Obsidian plugin.
#
# Triggered by a bare version tag (0.0.3, 1.2.0). The clipper uses its own
# `statblock-clipper-v*` tags and its own workflow; this one used to match `*`
# and so fired on those too, drafting an empty plugin release beside every
# extension release.
name: Release Obsidian plugin

on:
    push:
        tags:
            # Glob, not regex: `[0-9]` is a class but `*` is the only repeat.
            # This matches 0.0.3 and 1.10.2 while excluding statblock-clipper-v*.
            - '[0-9]*.[0-9]*.[0-9]*'
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # A tag that disagrees with the manifest ships a version users
            # cannot update to, so fail here rather than at install time.
            - name: Check the tag matches the manifest
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest=$(node -p "require('./manifest.json').version")
                  package=$(node -p "require('./package.json').version")
                  if [ "$tag" != "$manifest" ] || [ "$tag" != "$package" ]; then
                    echo "tag=$tag manifest.json=$manifest package.json=$package"
                    echo "::error::Tag, manifest.json and package.json must agree. Run \`npm version <patch|minor|major>\`."
                    exit 1
                  fi

            - run: pnpm run lint
            - run: pnpm run build

            - name: Package plugin
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  mkdir -p daggerheart-toolkit/data
                  cp main.js manifest.json styles.css daggerheart-toolkit/
                  # The zip ships the SRD data, so the DPCGL notice covering it
                  # has to travel with it.
                  cp LICENSE daggerheart-toolkit/
                  cp -r data/* daggerheart-toolkit/data/
                  zip -r "daggerheart-toolkit-$tag.zip" daggerheart-toolkit/

            # Fails when the tag has no changelog section, so a release cannot
            # go out with autogenerated commit-subject notes by accident.
            - name: Build release notes
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  node scripts/changelog-section.mjs "$tag" > release-notes.md
                  cat release-notes.md

            # Obsidian's installer fetches main.js, manifest.json and styles.css
            # as individual assets; it cannot read them out of the zip. 0.0.2
            # shipped the zip alone and so could not be installed from the
            # release. The zip stays for manual installs.
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" \
                    --title="$tag" \
                    --notes-file release-notes.md \
                    --draft \
                    main.js manifest.json styles.css "daggerheart-toolkit-$tag.zip"
