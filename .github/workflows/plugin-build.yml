# Validates the Obsidian plugin and shared statblock regressions.
name: Plugin Build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scripts/test-compendium-path.mjs'
      - 'scripts/test-encounter-thresholds.mjs'
      - 'scripts/test-statblock-format.mjs'
      - 'scripts/test-statblock-import-integration.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/plugin-build.yml'
  push:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'scripts/test-compendium-path.mjs'
      - 'scripts/test-encounter-thresholds.mjs'
      - 'scripts/test-statblock-format.mjs'
      - 'scripts/test-statblock-import-integration.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/plugin-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test:compendium
      - run: pnpm run test:thresholds
      - run: pnpm run test:statblock-format
      - run: pnpm run test:statblock-import
      - run: pnpm run build
