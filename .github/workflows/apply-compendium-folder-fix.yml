name: Apply compendium folder fix

on:
  pull_request:
    paths:
      - '.github/workflows/apply-compendium-folder-fix.yml'
      - '.github/scripts/apply_compendium_fix.py'
      - 'src/services/compendium-path.ts'
      - 'scripts/test-compendium-path.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/statblock-homebrew-import
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply source patch
        run: python .github/scripts/apply_compendium_fix.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:compendium
      - run: pnpm run build
      - name: Commit source fix
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain src/main.ts src/services/compendium.ts)" ]]; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/services/compendium.ts
          git commit -m 'fix: reload Markdown compendium folders reliably'
          git push origin HEAD:agent/statblock-homebrew-import
