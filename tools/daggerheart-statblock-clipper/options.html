<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daggerheart Clipper Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="options">
    <h1>Daggerheart Clipper Settings</h1>
    <label>Vault name or ID<input id="vault" type="text"></label>
    <label>Folder<input id="folder" type="text"></label>
    <label class="check"><input id="overwrite" type="checkbox">Overwrite existing note</label>
    <button id="save" class="primary">Save</button>
    <p id="status" class="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
