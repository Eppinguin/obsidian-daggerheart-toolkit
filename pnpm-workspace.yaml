# pnpm 10+ refuses to run dependency build scripts unless they are approved
# here, and `--frozen-lockfile` turns that refusal into a hard error, so CI
# could not install at all. esbuild needs its postinstall to fetch the
# platform-specific binary.
#
# pnpm 11 renamed this from `onlyBuiltDependencies` (a list) to `allowBuilds`
# (a map); the old key is silently ignored.
allowBuilds:
    esbuild: true
